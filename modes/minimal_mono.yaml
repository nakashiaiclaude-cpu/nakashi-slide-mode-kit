mode_id: minimal_mono
label: "ミニマル白黒モノトーン"
created: 2026-08-13
source: "運用者承認の15種拡張（8種追加）の1件目。ChatGPT(GPT-Image)生成サンプル画像を先に作り、そこから逆算してtaste/composition/paletteを定義（confirm/minimal_mono.png参照）"

taste: 究極のミニマル・余白の贅沢さで魅せる白黒モノトーン   # 装飾ゼロ、色を使わないことそのものが強み

base: null   # 紺×オレンジの運用者の主力ブランド配色を一切使わない、彩度ゼロの独立系統

render_target: html_claude_design   # フラットな線・タイポグラフィのみで構成され、写真・質感に依存しないため直接制御が向く

overrides:
  color_emphasis: >
    黒(ink_black)と白(bg_white)の2色のみを基本とし、区切り線・補助情報にのみ
    淡いグレー(line_gray)を使う。アクセントカラーは一切使わない。「色を足さない」
    ことがこのモードの唯一のルールで、強調は太さ・サイズ・余白の差でのみ行う。
  typography: >
    見出しは極太のゴシック体（Black〜ExtraBold級）を大きく使い、文字そのものを
    主役にする。本文はレギュラー〜ミディアムのゴシック体。書体はすべて同一
    ファミリーで統一し、ウェイトの差だけで階層を作る。
  icon_style: >
    アイコン・絵文字は原則使わない。どうしても要素を示す必要がある場合は
    ink_blackの極細ラインのみの幾何学的な印にとどめる。
  copy_style: >
    言葉数を絞った言い切り型。装飾的な形容詞を避け、名詞・短文だけで
    構成する。キャッチコピー的な強調語も使わない（太さの差で十分強調になる）。
  element_density: >
    1スライドの要素数は他モードより少なめの2〜4個を基本とする。余白を
    詰めない。文字と文字の間・要素と要素の間の余白を意図的に広く取ることが
    このモードの心地よさの核。

composition:
  heading: "太字見出しの直下に細いink_blackの短い一本線を添える（glow_dividerのような装飾的表現はしない、線のみ）"
  body_text: "ink_blackのレギュラーウェイト段落。行間を広めに取る"
  list: "文字だけの項目を横一列または縦一列に並べ、項目間をline_grayの極細縦線・横線で区切るのみ（背景色・アイコンは付けない）"
  comparison_2: "左右に同じ書式の見出し＋本文を配置し、中央をline_grayの一本の縦線で区切るだけの対比"
  table_or_data: "罫線を最小限にした表、またはinfo_barと同じ帯の中に数値のみを太字で置く"
  summary_statement: "info_bar（画面下部の淡いグレー帯、中に黒文字を小さめに配置）"
  background: "無地の真っ白。装飾・グラデーション・ドットパターンは一切使わない"

palette:
  ink_black: "#111111"     # 見出し・本文・線のすべての基本色
  bg_white: "#ffffff"      # 地の背景。唯一の背景色
  line_gray: "#d8d8d8"     # 区切り線・補助帯の背景のみに使う淡いグレー

components:
  divider_short:
    description: >
      見出し直下に置く、ink_blackの短い一本の細線。装飾（丸・グロー等）は
      一切付けない、線のみのシンプルな区切り。
    render_spec:
      line: "幅80-120px・高さ2px、見出し中央または左端に揃えて配置"
  plain_columns:
    description: >
      文字だけの項目を横一列に並べる部品。各項目は見出し語のみ（アイコン・
      背景色なし）、項目間をline_grayの極細縦線1本で区切る。
    render_spec:
      divider: "幅1px・高さは項目の文字高さに合わせる。line_grayで塗る"
  info_bar:
    description: >
      画面下部に置く、line_grayの薄い横長の帯。中にink_blackの文字を
      小さめに1行だけ配置する。装飾・アイコンは付けない。
  compare_split:
    description: >
      画面を左右2分割し、中央をline_grayの縦線1本で区切って対比を見せる
      部品。左右それぞれに同一書式の見出し＋本文を置く。

notes: >
  2026年トレンドの「ミニマル・エディトリアル」寄りだが、editorial_magazineとは
  明確に差別化する：本モードは彩度ゼロ・アシンメトリーなグリッドなし・
  装飾なしの純粋な引き算のデザインで、editorial_magazineの赤アクセント×
  非対称グリッド×太い見出しタイポグラフィとは系統が異なる。既存7モードとも
  彩度ゼロという点で一切被らない。confirm/minimal_mono.pngはChatGPT(GPT-Image)
  生成のサンプルスライド（内容は「サンプル資料タイトル」の汎用プレースホルダー。商品化パッケージ側confirmと共通画像を使うためのコスト効率判断）を
  参照実装として使う。
