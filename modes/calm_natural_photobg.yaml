mode_id: calm_natural_photobg
label: "静か・ナチュラル・写真ブラー背景"
created: 2026-07-09
source: "運用者提供サンプル1件目（表紙+目次+概要+ルールの4枚）"

taste: 静か・ナチュラル・落ち着き   # 低彩度、癒やし系、朝の静けさを想起させる見た目の系統

base: null   # 運用者の主力ブランドの紺×オレンジ配色とは系統が異なるため、ロゴ配置ルール以外は適用しない

render_target: html_claude_design   # 文字組・区切り線・パネルはhtmlで足りる。photo_blur_bandの窓辺写真はClaude Design側で用意する素材で合成する

overrides:
  color_emphasis: >
    低彩度のセージグリーン＋グレーがかった配色でほぼモノトーンに近い。
    ビビッドなアクセントカラーは使わず、差し色は最上端の極細バイオレットライン
    1本のみ（強調というより区切り線としての機能）。背景は白〜オフホワイトが基本、
    要素の背景に薄いセージグリーンの角丸パネルを敷いて情報をグルーピングする。
  photo_treatment: >
    見出しの背景に自然光の差す室内窓辺のぼかし写真を使う場合、文字は写真の上に
    直接重ねる（枠や半透明の帯は敷かない）。写真を使わない内容部分では、白背景の
    上端・下端にごく薄く同系統のぼかし写真を帯状に残す程度に留めてよい。
  typography: >
    見出しは明朝体寄りの太字セリフ体（Noto Serif JP / Zen Old Mincho級）。
    運用者の主力ブランドは日本語ビジネス資料でセリフ体を避ける方針のため、
    このモードはその例外として扱う。英字の添え書きはレタースペース広め（5-6px）の
    セリフ体キャプション。本文・ラベルは太めのゴシックで可読性を確保する。
  icon_style: >
    フラットな線画アイコン（丸縁の時計・チェックマーク等）を配色と同系統のトーンで
    統一。絵文字風・グラデーション・立体的なアイコンは使わない。
  copy_style: >
    短い体言の見出し＋丁寧語の本文。色やバッジによるキーワード強調はほぼ行わず、
    ウェイト差（太字/細字）だけで階層を作る、静かなトーン。
  element_density: 中程度（1画面3〜6要素。詰め込みすぎない）

composition:
  heading: "serif_center_block（単発の大見出し。中央揃え・区切り線・添え書きのセット）。本文の中の小見出しはtop_rule_violetの下に明朝太字1行を左揃えで置く"
  body_text: "ゴシックの本文をside_panelまたはカラム内に収める"
  list: "check_list（チェック付きの並列項目）、または手順・目次的な列挙にはnumber_badge_list"
  comparison_2_or_3: "three_column_rule（2〜3項目の均等分割比較）"
  table_or_data: "side_panelの中にキー：値の表形式で収める"
  summary_statement: "divider（幅480-560pxの1px水平線）の下に『ラベル： 値』形式で一言添える"
  background: "photo_blur_band。写真を主役にする画面は全面、そうでない画面は上端のみ薄く帯状に"

palette:
  heading_graygreen: "#6b756a"   # 見出し文字（グレーがかった緑）
  text_soft: "#7c8577"           # 副題・キャプション
  text_strong: "#5b655a"         # 本文中の強調（太字部分）
  line_gray: "#9aa596"           # 区切り線・フッター
  panel_sage: "#e8efe4"          # 角丸パネル・チェックアイコンの背景（薄いセージ）
  accent_violet: "#6a5b8c"       # 最上端の極細ライン専用。他の用途には使わない
  bg: "#ffffff"

components:
  top_rule_violet:
    description: >
      画面最上端に幅3-4pxのaccent_violetの水平線を全幅に引く。このモード唯一の
      「セージ系以外の色」であり、他の場所では使わない。
  photo_blur_band:
    description: >
      自然光の窓辺写真に強いブラー（blur 40-60px相当）をかけて背景化し、白を
      重ねて明度を上げる（文字が直接載る前提の淡さまで飛ばす）。全面使用と
      上端帯のみの部分使用の両方を持つ、内容量に応じて選べる背景部品。
  serif_center_block:
    description: >
      中央揃えのテキスト構成。上から (1)添え書き 20-22px・字間5-6px、
      (2)明朝太字の大見出し 72-80px・字間4px、(3)幅480-560pxの1px水平線(line_gray)、
      (4)「ラベル： 値」形式の一言 20-22px（値のみ太字・text_strong）。
      要素間マージンは18-28pxで詰めすぎない。
  number_badge_list:
    description: >
      丸バッジ番号のリスト。直径40-48pxの円（線のみ・line_gray、塗りなし）に
      2桁数字、右に太字明朝のラベル1行。縦に3〜5項目、行間は広め。
  check_list:
    description: >
      各行の先頭にpanel_sage塗りの円形チェックアイコン（直径22-26px、チェックは白）、
      右にゴシック本文1行。3項目前後を縦積みする。
  side_panel:
    description: >
      panel_sageの角丸パネル（角丸12-16px、影なし）。内部は上からアイコン＋
      小見出しの行、1px水平線、キー：値の表形式または本文段落。
      スライド右側1/3〜1/2を占める。
  three_column_rule:
    description: >
      2〜3カラム均等分割。各カラム＝番号（01/02/03、任意）→太字明朝見出し
      （2行まで）→line_grayの水平線→ゴシック本文3-4行。カラム間は1pxの縦罫線
      (line_gray)で区切る。
  line_illustration:
    description: >
      1〜2色トーンの線画イラスト。panel_sage系の色のみで描き、写真とは
      併用しない（どちらか一方）。
  footer_pair:
    description: >
      左下にラベル、右下に補足を15px・line_grayで対に配置する。

notes: >
  クライアント/テーマ別カラーパレットの一例として、色相だけ差し替えれば
  （例：ブルーグレー系、ベージュ系）同じ構造パターンを再利用できるよう、
  componentsは配色非依存の記述にしている。写真ブラー背景とセリフ見出しの2点が
  このモード特有。もとになったサンプルは進行案内型の資料だったが、compositionは
  内容の形状（見出し・リスト・比較・表・まとめ文）ベースで一般化してあるため、
  用途を問わず適用できる。confirm/calm_natural_photobg.htmlが参照実装。
