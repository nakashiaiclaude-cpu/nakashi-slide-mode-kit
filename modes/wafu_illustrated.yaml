mode_id: wafu_illustrated
label: "和風イラストテーマ（桜×朱色の陽×墨絵シルエット）"
created: 2026-07-10
source: "運用者提供サンプル4件目（表紙+Background+Conclusionの3枚、テンプレ由来の和風イラストデッキ）"

taste: 和風・イラスト調・テーマ性（桜・朱色の陽・墨絵シルエット）

base: null   # 配色・構成ともに運用者の主力ブランドと系統が異なるため、ロゴ配置ルール以外は適用しない

render_target: notebooklm   # シルエット構図自体はhtml(SVG)でも作れるが、陽の筆致テクスチャや桜の繊細さはストック素材の組み合わせでは出せず、生成品質が必要

overrides:
  color_emphasis: >
    色は情報の色分け（機能色）ではなく雰囲気づけ（ムード）に徹する。
    朱色/臙脂(sun_maroon)＝陽モチーフと見出し文字。黒(silhouette_black)＝
    シルエットイラスト専用（本文黒とは役割を分ける）。桜ピンク＝花・花びらのみ。
    グレー＝雲・遠景の山のみ。
  typography: >
    見出しは丸みのある太字ゴシック（Baloo系の丸ゴシック、朱色）で柔らかさ・
    親しみを優先する。サブラベルは細字・字間広め・小さめのキャプション。
    本文は素直なゴシック・黒の段落ブロック。
  icon_style: >
    アイコンではなくシルエットイラストで語る。日本的モチーフのフラットな黒/グレーの
    シルエットのみ。面積の大きいものには白い切り絵風のディテール線を入れてよい。
  copy_style: >
    短い体言の見出し。本文は説明的な段落でよく、キーワード強調やバッジ装飾は
    行わない。余白と絵で「間」を作ることを優先する。
  element_density: >
    見出し+本文の2テキスト要素＋イラストクラスター1つ、という最小構成が基本。
    情報を詰め込みたい内容には不向きで、要素数の少ない画面に限定して使う。

composition:
  heading: "condensed_display不使用。丸みのある太字ゴシック見出しを、テキスト面（余白側）に短く体言で置く"
  body_text: "見出しの下に説明的な段落を1つ。余白を保ち、詰め込まない"
  list: "このモードは列挙・チェックリストの部品を持たない。箇条書きが必要な内容は他モードに譲るか、短文1つに要約してから使う"
  comparison_2: "テキスト面とイラスト面を左右反転させる形でしか対比を表現しない（項目同士の直接比較には不向き）"
  table_or_data: "表・数値を主役にする内容には不向き。どうしても必要な場合は本文中の一言に圧縮する"
  summary_statement: "本文の最後に短い一文で締める（バッジ・強調装飾は使わない）"
  background: "top_rule＋sun_motif＋silhouette_illustration＋sakura_accent＋cloud_flatの組み合わせで、テキストのある側の反対側に配置"

palette:
  sun_maroon: "#8a1c1c"        # 陽モチーフ・見出し文字
  silhouette_black: "#111111"  # 建物・山・木・鳥のシルエット
  sakura_pink: "#f3c6cf"        # 桜の花・花びら
  branch_brown: "#7a5344"       # 桜の枝
  cloud_gray: "#9a9a9a"         # 雲・遠景の山
  body_black: "#1a1a1a"         # 本文テキスト
  bg: "#ffffff"

components:
  top_rule:
    description: >
      画面最上端に幅2-3pxのsilhouette_blackの水平線を全幅に1本。
  sun_motif:
    description: >
      朱色の大きな「陽」。きれいな正円ではなく筆致の荒れた輪郭を持つ。
      他のシルエット要素がこの円に手前から重なる背景要素として使う。
    render_spec:
      shape: "直径400-500pxの円を、10-16点をランダムに揺らしたクローズドパスで描き輪郭を荒らす"
      fill: "sun_maroon。内側に同系色の濃淡2段のムラを入れると筆致感が増す"
  silhouette_illustration:
    description: >
      日本的モチーフのベタ塗り黒シルエット群。画面の端に配置し、中央/テキスト側の
      余白を侵食しない。
    render_spec:
      tower: "多層屋根（末広がりの台形を段々に重ねる）の塔。大面積なら白い窓の切り抜きを入れる"
      torii: "横棒2本+柱2本の門型。sun_motifの手前に重ねる"
      mountains: "cloud_gray系の三角形を2-3個連ねた遠景"
      tree: "丸みのある樹冠+細い幹。画面下端の隅"
      birds: "M字型の羽ばたきシルエットを2-3羽、空中に小さく"
  sakura_accent:
    description: >
      桜の枝と花びら。枝は画面の隅やsun_motifの脇から垂らす。
    render_spec:
      branch: "branch_brownの細い枝線に、直径14-20pxの5弁花（sakura_pink）を6-10輪"
      petals: "独立した花びら（雫形8-16px、opacity 0.6-0.85）を3-6枚、ランダムな位置・回転で散らす"
  cloud_flat:
    description: >
      cloud_grayのベタ塗りで横長の平たい雲を2-4個、空きスペースに小さめ・控えめに。

notes: >
  「情報を整理して伝える」他モードとは性質が異なり、世界観・雰囲気で魅せる
  ことに特化している。列挙・比較・数値といった情報構造は他モードに譲り、
  このモードは短い見出し+短い本文+イラストの組み合わせに限定して使うのが良い。
  モチーフは汎用語彙（陽・鳥居・塔・桜・山・雲・鳥）として抽象化してあり、
  特定テンプレ配布元やプレースホルダー文言は含めない。もとになったサンプルは
  一般的なプレゼン用テンプレートだったが、業種・用途を限定する情報は持たない。
  confirm/wafu_illustrated.htmlが参照実装。
