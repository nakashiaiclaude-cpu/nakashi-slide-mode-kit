<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>corporate_blue_standard confirm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #ffffff; overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .slide {
    width: 1280px; height: 720px; flex: none; position: relative; overflow: hidden;
    background: #ffffff; border-top: 3px solid #111111; box-sizing: border-box;
  }
  .content {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .logo-lockup { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .mark { width: 30px; height: 30px; position: relative; }
  .mark svg { width: 100%; height: 100%; }
  .wordmark { font-size: 18px; font-weight: 900; color: #111111; }
  .heading { font-size: 56px; font-weight: 900; color: #2f6fed; margin: 0 0 18px; }
  .subtitle { font-size: 20px; font-weight: 700; color: #1a1a1a; }

  .wave { position: absolute; left: 0; bottom: 0; width: 100%; height: 260px; z-index: 1; }
</style>
</head>
<body>
 <div class="stage">
  <div class="slide">
    <div class="content">
      <div class="logo-lockup">
        <span class="mark">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="2" width="18" height="18" transform="rotate(45 20 11)" fill="#2f6fed"/>
            <rect x="9" y="13" width="18" height="18" transform="rotate(45 9 22)" fill="#2f6fed"/>
            <circle cx="20" cy="20" r="4.5" fill="#e8772e"/>
          </svg>
        </span>
        <span class="wordmark">ブランド名</span>
      </div>
      <div class="heading">サンプル資料タイトル</div>
      <div class="subtitle">モードを選べば、狙った質感で仕上がる。</div>
    </div>
    <svg class="wave" viewBox="0 0 1280 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,140 C300,240 850,60 1280,150 L1280,260 L0,260 Z" fill="#d9dde3"/>
      <path d="M0,180 C300,260 900,110 1280,190 L1280,260 L0,260 Z" fill="#2f6fed"/>
      <path d="M0,180 C300,260 900,110 1280,190" fill="none" stroke="#0f2a6b" stroke-width="3"/>
    </svg>
  </div>
 </div>
</body>
</html>
