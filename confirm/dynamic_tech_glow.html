<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>dynamic_tech_glow confirm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@800;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #fafbfd;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide {
    width: 1280px;
    height: 720px;
    flex: none;
    position: relative;
    overflow: hidden;
    background: #fafbfd;
  }
  .wave {
    position: absolute;
    border-radius: 50%;
  }
  .wave1 {
    width: 1400px; height: 1400px; left: -500px; top: -900px;
    background: linear-gradient(160deg, #eef1f6 0%, #ffffff 60%);
  }
  .wave2 {
    width: 1200px; height: 1200px; right: -600px; bottom: -850px;
    background: linear-gradient(-20deg, #eef1f6 0%, #ffffff 60%);
  }
  .dots {
    position: absolute;
    width: 460px;
    height: 380px;
    background-image: radial-gradient(#e8772e 1.6px, transparent 1.6px);
    background-size: 16px 16px;
    -webkit-mask-image: radial-gradient(circle at 100% 0%, #000 0%, transparent 70%);
    mask-image: radial-gradient(circle at 100% 0%, #000 0%, transparent 70%);
    opacity: 0.35;
  }
  .dots.tr { top: 0; right: 0; }
  .dots.bl {
    bottom: 0; left: 0;
    -webkit-mask-image: radial-gradient(circle at 0% 100%, #000 0%, transparent 70%);
    mask-image: radial-gradient(circle at 0% 100%, #000 0%, transparent 70%);
  }
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .title {
    font-size: 72px;
    font-weight: 900;
    color: #1a2233;
    letter-spacing: 2px;
    margin: 0 0 34px;
  }
  .divider {
    position: relative;
    width: 560px;
    height: 2px;
    background: linear-gradient(90deg, rgba(22,35,63,0) 0%, #1a2233 45%, #1a2233 55%, rgba(22,35,63,0) 100%);
    margin-bottom: 34px;
  }
  .divider::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 16px; height: 16px;
    background: #e8772e;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 6px rgba(232,119,46,0.18), 0 0 24px 10px rgba(232,119,46,0.35);
  }
  .subtitle {
    font-size: 26px;
    font-weight: 700;
    color: #2a3a5c;
  }
</style>
</head>
<body>
 <div class="stage">
  <div class="slide">
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="dots tr"></div>
    <div class="dots bl"></div>
    <div class="content">
      <div class="title">ブランド名</div>
      <div class="divider"></div>
      <div class="subtitle">サンプル資料タイトル</div>
    </div>
  </div>
 </div>
</body>
</html>
