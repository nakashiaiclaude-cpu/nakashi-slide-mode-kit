<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>calm_natural_photobg confirm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Zen+Old+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  .stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide {
    width: 1280px;
    height: 720px;
    flex: none;
    position: relative;
    overflow: hidden;
    background: #ffffff;
    border-top: 4px solid #6a5b8c;
    font-family: 'Noto Serif JP', serif;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
  }
  .blob1 { width: 520px; height: 520px; left: -120px; top: -140px; background: #cfe0c9; }
  .blob2 { width: 460px; height: 460px; right: -140px; top: 60px; background: #e4ecd8; }
  .blob3 { width: 600px; height: 320px; left: 30%; bottom: -180px; background: #d7e3cf; }
  .blob4 { width: 300px; height: 300px; right: 10%; bottom: -80px; background: #f2f5ee; }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .eyebrow {
    font-family: 'Zen Old Mincho', serif;
    font-size: 22px;
    letter-spacing: 6px;
    color: #7c8577;
    margin-bottom: 18px;
  }
  .title {
    font-size: 76px;
    font-weight: 700;
    color: #6b756a;
    letter-spacing: 4px;
    margin: 0 0 28px;
  }
  .divider {
    width: 520px;
    height: 1px;
    background: #9aa596;
    margin-bottom: 26px;
  }
  .theme-line {
    font-size: 22px;
    color: #7c8577;
    letter-spacing: 1px;
  }
  .theme-line b {
    color: #5b655a;
    font-weight: 700;
    margin-left: 8px;
  }
  .footer {
    position: absolute;
    left: 44px;
    bottom: 30px;
    font-size: 15px;
    color: #9aa596;
    z-index: 2;
    letter-spacing: 1px;
  }
  .footer.right {
    left: auto;
    right: 44px;
  }
</style>
</head>
<body>
 <div class="stage">
  <div class="slide">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <div class="blob blob4"></div>
    <div class="content">
      <div class="eyebrow">Claude Code &times; Slide Creation</div>
      <div class="title">ブランド名</div>
      <div class="divider"></div>
      <div class="theme-line">テーマ： <b>サンプル資料タイトル</b></div>
    </div>
    <div class="footer">ブランド名</div>
    <div class="footer right">デザインモード確認用</div>
  </div>
 </div>
<script>
  function fit() {
    var scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  fit();
  window.addEventListener('resize', fit);
</script>
</body>
</html>
